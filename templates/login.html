<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Galactic Federal Vault</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
        <h2 class="text-3xl font-extrabold text-center text-cyan-400 mb-2">Galactic Federal Vault</h2>
        <p class="text-gray-400 text-center text-sm mb-6">Secure Multi-Role Banking Terminal</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="bg-red-900/50 border border-red-500 text-red-200 p-3 rounded mb-4 text-sm">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">Account ID / Username</label>
                <input type="text" name="username" required class="w-full bg-gray-700 border border-gray-600 rounded p-2.5 text-white focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">Security PIN</label>
                <input type="password" name="pin" required class="w-full bg-gray-700 border border-gray-600 rounded p-2.5 text-white focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">Terminal Access Role</label>
                <select name="role" class="w-full bg-gray-700 border border-gray-600 rounded p-2.5 text-white focus:outline-none focus:border-cyan-400">
                    <option value="customer">Customer Access</option>
                    <option value="admin">System Administrator</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-600 text-gray-900 font-bold p-3 rounded transition duration-200">Authenticate</button>
        </form>
    </div>
</body>
</html>
